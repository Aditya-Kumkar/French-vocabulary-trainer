name: Verify app

on:
  pull_request:
  push:
    branches:
      - main
      - feature/automated-verification

jobs:
  build-and-mobile-smoke-test:
    name: Build and mobile browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-placeholder-key-for-build-only
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Playwright test runner
        run: npm install --no-save @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test spaced repetition scheduling
        run: node --test tests/revision.test.js

      - name: Verify production build
        run: npm run build

      - name: Run mobile browser smoke test
        run: npx playwright test
